<!DOCTYPE html>
<html>
<head>
    <title>Wipro Logo Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .logo-container {
            text-align: center;
            color: #fff;
        }
        .wipro-text {
            font-size: 120px;
            font-weight: bold;
            color: #00a8e6;
            margin-bottom: 20px;
        }
        .tagline {
            font-size: 24px;
            color: #fff;
            font-weight: 300;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="instructions">
        Instructions:<br>
        1. Take a screenshot of this page<br>
        2. Save as "wipro-logo.png" in the public folder<br>
        3. Delete this HTML file
    </div>
    <div class="logo-container">
        <div class="wipro-text">WIPRO</div>
        <div class="tagline">Applying thought</div>
    </div>
</body>
</html>
